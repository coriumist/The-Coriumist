name: daily circuit build
on:
  schedule:
    - cron: "0 6 * * *"        # 06:00 UTC every day
  workflow_dispatch:           # also runnable by hand from the Actions tab
  push:                        # a change to the engine or the dataset rebuilds immediately
    branches: [main]
    paths: ["tools/**", "data/circuit.json", ".github/workflows/daily.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Destination photography (licensed; Unsplash if a key is set, else Wikimedia Commons)
        timeout-minutes: 25
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          pip install --quiet pillow
          python3 tools/photos.py || echo "photo step failed; site falls back to the tint layer"
      - name: Build today's read and every page
        run: python3 tools/build.py
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Smoke test every page type (fails the run before anything is committed)
        run: |
          npm install --silent --no-save jsdom@24 leaflet@1.9.4
          node tools/smoke.js
      - name: Commit if anything changed
        run: |
          git config user.name "coriumist-daily"
          git config user.email "coriumist.ops@gmail.com"
          git add -A site data
          git diff --cached --quiet || git commit -m "daily read $(date -u +%F)"
          git pull --rebase --autostash origin main
          git push
