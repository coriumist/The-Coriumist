name: daily circuit build
on:
  schedule:
    - cron: "0 6 * * *"        # 06:00 UTC every day
  workflow_dispatch:           # also runnable by hand from the Actions tab
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Destination photography (licensed; Unsplash if a key is set, else Wikimedia Commons)
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: python3 tools/photos.py || echo "photo step failed; site falls back to the tint layer"
      - name: Build today's read and every page
        run: python3 tools/build.py
      - name: Commit if anything changed
        run: |
          git config user.name "coriumist-daily"
          git config user.email "coriumist.ops@gmail.com"
          git add -A site data
          git diff --cached --quiet || git commit -m "daily read $(date -u +%F)"
          git push
